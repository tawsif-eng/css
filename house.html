<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook ID Manager</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f0f2f5;

    header {
      background: #1877f2;

      margin-bottom: 6px;

    .container {
      max-width: 950px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);

    .add-btn:hover {
      background: #0d65d9;

      margin-bottom: 15px;

    .profile {
      display: flex;
      justify-content: space-between;

</head>

<body>

  <header>
    <h1>📘 Facebook ID Manager</h1>
    <p>Manage your Facebook profile links easily</p>
  </header>

  <div class="container">

    <!-- Add Profile -->
    <div class="card">
      <h2 id="formTitle">➕ Add Facebook Profile</h2>
      <br>

      <div class="form-grid">

        <input
          type="text"
          id="name"
          placeholder="Person's Name"
        >

        <input
          type="text"
          id="category"
          placeholder="Category (Friend, Student, Client...)"
        >

        <input
          class="full"
          type="url"
          id="facebook"
          placeholder="https://www.facebook.com/profile"
        >

        <button
          class="add-btn full"
          id="saveBtn"
          onclick="saveProfile()"
        >
          Add Profile
        </button>

      </div>
    </div>

    <!-- Search -->
    <div class="card">
      <h2>🔎 Search Profiles</h2>
      <br>

      <input
        class="search"
        type="text"
        id="search"
        placeholder="Search by name or category..."
        oninput="displayProfiles()"
      >

      <div id="profileList"></div>
    </div>

  </div>

<script>

  let profiles = JSON.parse(
    localStorage.getItem("facebookProfiles")
  ) || [];

  let editIndex = -1;


  // Save profile
  function saveProfile() {

    const name = document.getElementById("name").value.trim();
    const facebook = document.getElementById("facebook").value.trim();
    const category = document.getElementById("category").value.trim();

    if (!name || !facebook) {
      alert("Please enter name and Facebook profile link.");
      return;
    }

    if (!facebook.startsWith("http://") &&
        !facebook.startsWith("https://")) {

      alert("Please enter a valid Facebook URL.");
      return;
    }

    const profile = {
      name: name,
      facebook: facebook,
      category: category || "General"
    };

    if (editIndex === -1) {

      profiles.push(profile);

    } else {

      profiles[editIndex] = profile;
      editIndex = -1;

      document.getElementById("formTitle").innerText =
        "➕ Add Facebook Profile";

      document.getElementById("saveBtn").innerText =
        "Add Profile";
    }

    localStorage.setItem(
      "facebookProfiles",
      JSON.stringify(profiles)
    );

    clearForm();
    displayProfiles();
  }


  // Display profiles
  function displayProfiles() {

    const list = document.getElementById("profileList");
    const search = document
      .getElementById("search")
      .value
      .toLowerCase();

    const filtered = profiles.filter(profile =>
      profile.name.toLowerCase().includes(search) ||
      profile.category.toLowerCase().includes(search)
    );

    list.innerHTML = "";

    if (filtered.length === 0) {

      list.innerHTML = `
        <div class="empty">
          No Facebook profiles found.
        </div>
      `;

      return;
    }

    filtered.forEach((profile) => {

      const originalIndex = profiles.indexOf(profile);

      const div = document.createElement("div");

      div.className = "profile";

      div.innerHTML = `

        <div class="profile-info">

          <h3>👤 ${escapeHTML(profile.name)}</h3>

          <p>
            ${escapeHTML(profile.facebook)}
          </p>

          <span class="category">
            ${escapeHTML(profile.category)}
          </span>

        </div>

        <div class="actions">

          <button
            class="open-btn"
            onclick="openFacebook('${encodeURI(profile.facebook)}')">
            Open
          </button>

          <button
            class="edit-btn"
            onclick="editProfile(${originalIndex})">
            Edit
          </button>

          <button
            class="delete-btn"
            onclick="deleteProfile(${originalIndex})">
            Delete
          </button>

        </div>
      `;

      list.appendChild(div);
    });
  }


  // Open Facebook
  function openFacebook(url) {
    window.open(url, "_blank");
  }


  // Edit
  function editProfile(index) {

    const profile = profiles[index];

    document.getElementById("name").value =
      profile.name;

    document.getElementById("facebook").value =
      profile.facebook;

    document.getElementById("category").value =
      profile.category;

    editIndex = index;

    document.getElementById("formTitle").innerText =
      "✏️ Edit Facebook Profile";

    document.getElementById("saveBtn").innerText =
      "Update Profile";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  // Delete
  function deleteProfile(index) {

    const confirmDelete =
      confirm("Are you sure you want to delete this profile?");

    if (!confirmDelete) return;

    profiles.splice(index, 1);

    localStorage.setItem(
      "facebookProfiles",
      JSON.stringify(profiles)
    );

    displayProfiles();
  }


  // Clear form
  function clearForm() {

    document.getElementById("name").value = "";
    document.getElementById("facebook").value = "";
    document.getElementById("category").value = "";
  }


  // Basic HTML escaping
  function escapeHTML(text) {

    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // Initial display
  displayProfiles();

</script>

</body>
</html>
